<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>MapLibre 3D Terrain & Globe</title>
  <script src="https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.js"></script>
  <link href="https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.css" rel="stylesheet" />
  <style>
    body { margin: 0; padding: 0; }
    #map { position: absolute; top: 0; bottom: 0; width: 100%; }
  </style>
</head>
<body>
  <div id="map"></div>
  <script>
    const map = new maplibregl.Map({
      container: 'map',
      // 1. Enable Globe view via style projection options
      style: {
        version: 8,
        projection: { type: 'globe' }, 
        sources: {
          // Base satellite imagery layer
          'satellite': {
            type: 'raster',
            tiles: ['https://tiles.maps.eox.at/wmts/1.0.0/s2cloudless-2020_3857/default/g/{z}/{y}/{x}.jpg'],
            tileSize: 256
          },
          // 2. Add Digital Elevation Model (DEM) data source for 3D heights
          'terrain-source': {
            type: 'raster-dem',
            url: 'https://demotiles.maplibre.org/terrain-tiles/tiles.json',
            tileSize: 256
          }
        },
        layers: [
          {
            id: 'satellite-layer',
            type: 'raster',
            source: 'satellite'
          }
        ],
        // 3. Apply the DEM source to render true 3D terrain
        terrain: {
          source: 'terrain-source',
          exaggeration: 1.5 // Multiplier for mountain heights
        }
      },
      center: [137.91, 36.25], // Centered over the Japanese Alps
      zoom: 3,
      pitch: 65, // Tilt the camera to emphasize 3D mesh elevation
      maxPitch: 85
    });

    // Optional: Add terrain and navigation controls to the map UI
    map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }));
    map.addControl(new maplibregl.TerrainControl({ source: 'terrain-source', exaggeration: 1.5 }));
  </script>
</body>
</html>
