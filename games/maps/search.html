<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <!-- Best-effort hint against this document itself being cached — GitHub Pages
       doesn't let us set a real Cache-Control HTTP header, and not every browser
       honors this meta form, but it costs nothing and some do respect it. -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>MapLibre 3D Terrain & Globe</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#1f2937" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <!-- Vendored locally (see vendor/maplibre-gl/README.md) instead of loaded from a CDN:
       @latest on unpkg silently broke once MapLibre v6 dropped this UMD bundle, and a
       third-party CDN is one more thing that can be slow or blocked on a given network. -->
  <script src="vendor/maplibre-gl/maplibre-gl.js" onerror="window.__mapEditorScriptError='vendor/maplibre-gl/maplibre-gl.js failed to load'"></script>
  <link href="vendor/maplibre-gl/maplibre-gl.css" rel="stylesheet" />
  <link href="css/map-editor.css?v=2026-08-26.27" rel="stylesheet" />
  <style>
    body { margin: 0; padding: 0; }
  </style>
</head>
<body>
  <div id="fatal-error-banner" class="hidden" style="position:fixed;top:0;left:0;right:0;z-index:10000;background:#b91c1c;color:#fff;padding:10px 14px;font:13px/1.4 monospace;white-space:pre-wrap;"></div>

  <div id="app">
    <header id="toolbar">
      <div class="search-box">
        <span class="search-icon" aria-hidden="true">🔍</span>
        <input id="search-input" placeholder="Search places..." autocomplete="off" />
        <button id="search-clear" type="button" class="search-clear hidden" aria-label="Clear search">✕</button>
        <div id="search-results" class="search-results hidden"></div>
      </div>

      <div class="toolbar-actions">
        <button id="sidebar-toggle-button" type="button" class="nav-item">
          <span class="nav-icon">☷</span><span class="nav-label">Objects</span>
        </button>

        <div class="add-menu">
          <button id="add-button" type="button" class="nav-item">
            <span class="nav-icon">＋</span><span class="nav-label">Add</span>
          </button>
          <div id="add-dropdown" class="dropdown hidden">
            <button type="button" data-add="point">📍 Point<span>Add a location</span></button>
            <button type="button" data-add="line">╱ Line<span>Draw a route/line</span></button>
            <button type="button" data-add="polygon">▱ Area<span>Draw an area</span></button>
            <div class="dropdown-divider"></div>
            <button type="button" data-add="measure">📏 Measure<span>Distance and area, not saved</span></button>
          </div>
        </div>

        <div class="view-menu">
          <button id="view-button" type="button" class="nav-item">
            <span class="nav-icon">🗺</span><span class="nav-label">View</span>
          </button>
          <div id="view-dropdown" class="dropdown hidden">
            <div class="dropdown-section-label">Map style</div>
            <div class="style-grid">
              <button type="button" data-style="street" class="style-option">
                <svg class="style-thumb" viewBox="0 0 48 48" aria-hidden="true">
                  <rect width="48" height="48" fill="#e9e5dc" />
                  <rect x="0" y="20" width="48" height="4" fill="#ffffff" />
                  <rect x="20" y="0" width="4" height="48" fill="#ffffff" />
                  <rect x="0" y="34" width="48" height="2" fill="#ffffff" />
                  <path d="M0 8 L48 40" stroke="#f6a623" stroke-width="3" />
                </svg>
                <span class="style-label">Street</span>
              </button>
              <button type="button" data-style="satellite" class="style-option">
                <svg class="style-thumb" viewBox="0 0 48 48" aria-hidden="true">
                  <rect width="48" height="48" fill="#3f6b3f" />
                  <path d="M0 0 H48 V18 Q30 10 20 20 Q10 30 0 22 Z" fill="#5b8a4e" />
                  <path d="M0 48 H48 V30 Q35 40 25 32 Q15 24 0 34 Z" fill="#2e4d2a" />
                  <path d="M-5 15 Q20 25 55 20" stroke="#4a7ab5" stroke-width="5" fill="none" />
                </svg>
                <span class="style-label">Satellite</span>
              </button>
              <button type="button" data-style="terrain" class="style-option">
                <svg class="style-thumb" viewBox="0 0 48 48" aria-hidden="true">
                  <rect width="48" height="48" fill="#c9b591" />
                  <path d="M0 40 Q12 20 24 30 Q36 40 48 15" fill="none" stroke="#8a6d3b" stroke-width="2" />
                  <path d="M0 30 Q12 12 24 20 Q36 28 48 6" fill="none" stroke="#8a6d3b" stroke-width="2" opacity="0.7" />
                  <path d="M0 20 Q12 4 24 10" fill="none" stroke="#8a6d3b" stroke-width="2" opacity="0.5" />
                  <circle cx="34" cy="10" r="3" fill="#6b5230" />
                </svg>
                <span class="style-label">Terrain</span>
              </button>
              <button type="button" data-style="dark" class="style-option">
                <svg class="style-thumb" viewBox="0 0 48 48" aria-hidden="true">
                  <rect width="48" height="48" fill="#111827" />
                  <rect x="0" y="20" width="48" height="2" fill="#4b5563" />
                  <rect x="22" y="0" width="2" height="48" fill="#4b5563" />
                  <circle cx="22" cy="20" r="2" fill="#facc15" />
                  <circle cx="10" cy="34" r="1.5" fill="#facc15" />
                </svg>
                <span class="style-label">Dark</span>
              </button>
            </div>
            <div class="dropdown-divider"></div>
            <div class="dropdown-section-label">Projection</div>
            <button type="button" data-projection="mercator">▭ 2D</button>
            <button type="button" data-projection="globe">🌐 3D Globe</button>
          </div>
        </div>

        <div class="layers-menu">
          <button id="layers-button" type="button" class="nav-item">
            <span class="nav-icon">🗂</span><span class="nav-label">Layers</span>
          </button>
          <div id="layers-dropdown" class="dropdown hidden">
            <div class="dropdown-section-label">Your data</div>
            <button type="button" class="layer-toggle" data-layer="Point">
              <span class="layer-dot" style="background:#3b82f6"></span>
              <span class="layer-name">Places</span>
              <span class="layer-state"></span>
            </button>
            <button type="button" class="layer-toggle" data-layer="LineString">
              <span class="layer-dot" style="background:#f97316"></span>
              <span class="layer-name">Routes</span>
              <span class="layer-state"></span>
            </button>
            <button type="button" class="layer-toggle" data-layer="Polygon">
              <span class="layer-dot" style="background:#22c55e"></span>
              <span class="layer-name">Areas</span>
              <span class="layer-state"></span>
            </button>
            <div class="dropdown-divider"></div>
            <button type="button" class="layer-toggle" data-layer="labels">
              <span class="layer-dot layer-dot-outline"></span>
              <span class="layer-name">Labels</span>
              <span class="layer-state"></span>
            </button>
          </div>
        </div>

        <div class="more-menu">
          <button id="more-button" type="button" class="nav-item">
            <span class="nav-icon">⋯</span><span class="nav-label">Menu</span>
          </button>
          <div id="more-dropdown" class="dropdown hidden">
            <button type="button" data-action="my-maps">🗺️ My Maps</button>
            <div class="dropdown-divider"></div>
            <button type="button" data-action="import">⬆ Import data</button>
            <button type="button" data-action="export">⬇ Export data</button>
            <div class="dropdown-divider"></div>
            <button type="button" data-action="about">ℹ️ About</button>
          </div>
        </div>
        <input id="import-input" type="file" accept="application/json" hidden />
      </div>
    </header>

    <div id="body">
      <aside id="sidebar">
        <div class="sheet-handle"></div>
        <h2 id="sidebar-title">My Map</h2>
        <ul id="object-summary"></ul>
        <div id="object-list"></div>
      </aside>
      <div id="sidebar-scrim"></div>
      <div id="map"></div>

      <div id="drawing-hint" class="hint hidden">
        <span id="drawing-hint-text"></span>
        <div class="hint-actions">
          <button id="drawing-finish" type="button" class="hidden">Finish</button>
          <button id="drawing-cancel" type="button">Cancel</button>
        </div>
      </div>
    </div>
  </div>

  <div id="editor-overlay" class="overlay hidden">
    <form id="editor-form" class="dialog">
      <h3 id="editor-title">New Point</h3>
      <label>Name
        <input id="editor-name" name="name" required />
      </label>
      <label>Category
        <div id="editor-category-grid" class="category-grid"></div>
      </label>
      <label>Description
        <textarea id="editor-description" name="description" rows="3"></textarea>
      </label>
      <label>Files
        <div id="editor-file-list" class="file-list"></div>
        <button type="button" id="editor-file-add" class="file-add-button">＋ Add file</button>
        <input id="editor-file-input" type="file" multiple hidden />
      </label>
      <div class="dialog-actions">
        <button type="button" id="editor-cancel">Cancel</button>
        <button type="submit" id="editor-save">Save</button>
      </div>
    </form>
  </div>

  <div id="maps-overlay" class="overlay hidden">
    <div class="dialog maps-dialog">
      <h3>My Maps</h3>
      <div id="maps-list"></div>
      <div class="dialog-actions">
        <button type="button" id="maps-new">+ New map</button>
        <button type="button" id="maps-close">Close</button>
      </div>
    </div>
  </div>

  <div id="confirm-overlay" class="overlay hidden">
    <div class="dialog">
      <p id="confirm-message"></p>
      <div class="dialog-actions">
        <button type="button" id="confirm-cancel">Cancel</button>
        <button type="button" id="confirm-delete" class="danger">Delete</button>
      </div>
    </div>
  </div>

  <div id="about-overlay" class="overlay hidden">
    <div class="dialog">
      <h3>About</h3>
      <p id="about-version">map-editor build 2026-08-26.27</p>
      <div class="dialog-actions">
        <button type="button" id="about-close">Close</button>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var banner = document.getElementById("fatal-error-banner");
      function showError(message) {
        banner.textContent = "Error: " + message;
        banner.classList.remove("hidden");
      }
      // Once the app has reached a working state (see app.js), a later error is
      // most likely a background rendering glitch, not "the page shows nothing" —
      // log it instead of alarming the user with the full-page banner again.
      function reportError(message) {
        if (window.__mapEditorInitialized) {
          console.error("map-editor (post-init, not shown as a banner):", message);
        } else {
          showError(message);
        }
      }
      window.addEventListener("error", function (event) {
        var location = event.filename ? " (" + event.filename + ":" + event.lineno + ")" : "";
        reportError((event.message || "Unknown script error") + location);
      });
      window.addEventListener("unhandledrejection", function (event) {
        reportError(String(event.reason && event.reason.message ? event.reason.message : event.reason));
      });
      if (window.__mapEditorScriptError) {
        showError(window.__mapEditorScriptError);
      }
      setTimeout(function () {
        if (typeof window.maplibregl === "undefined") {
          showError(
            "vendor/maplibre-gl/maplibre-gl.js never loaded or failed to run — " +
              "the map cannot render without it."
          );
          return;
        }
        var summary = document.getElementById("object-summary");
        if (summary && summary.children.length === 0) {
          showError(
            "The map style never finished initializing (sidebar is still empty). " +
              "This is usually the satellite or terrain tile server being unreachable — " +
              "try again on a different network, or check the browser console for the failing request."
          );
        }
      }, 8000);
    })();
  </script>
  <script type="module" src="js/app.js?v=2026-08-26.27" onerror="document.getElementById('fatal-error-banner').textContent='Error: js/app.js failed to load as a module (opening this file directly with file:// blocks ES modules — serve it over http instead).'; document.getElementById('fatal-error-banner').classList.remove('hidden')"></script>
  <script>
    // Progressive enhancement only (installability + offline shell caching)
    // — never treated as fatal if it fails, unlike the diagnostics above.
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("sw.js").catch(function (error) {
          console.warn("Service worker registration failed", error);
        });
      });
    }
  </script>
</body>
</html>
