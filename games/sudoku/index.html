<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Sudoku</title>
<meta name="description" content="A fast, offline-capable mobile Sudoku game with notes, undo/redo, hints and four difficulty levels.">
<meta name="theme-color" content="#4f46e5">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sudoku">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <header class="topbar">
    <button id="menuBtn" class="icon-btn" type="button" aria-label="Open menu" aria-haspopup="dialog" aria-expanded="false" aria-controls="menuPanel">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>
    <h1 class="title">Sudoku</h1>
    <div class="topbar-right">
      <div id="difficultyBadge" class="difficulty-badge">Medium</div>
      <button id="timerBtn" class="icon-btn timer-btn" type="button" aria-label="Pause timer">
        <span id="timer" aria-live="off">00:00</span>
      </button>
    </div>
  </header>

  <main class="playfield">
    <div id="boardWrap" class="board-wrap">
      <div id="board" class="board" role="grid" aria-label="Sudoku board" aria-rowcount="9" aria-colcount="9"></div>
      <div id="pauseOverlay" class="pause-overlay hidden">
        <button id="resumeBtn" class="primary-btn" type="button">▶ Resume</button>
      </div>
    </div>

    <div id="statusLine" class="status-line" role="status" aria-live="polite"></div>

    <div class="toolbar">
      <button id="undoBtn" class="tool-btn" type="button" aria-label="Undo" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
        <span>Undo</span>
      </button>
      <button id="redoBtn" class="tool-btn" type="button" aria-label="Redo" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg>
        <span>Redo</span>
      </button>
      <button id="eraseBtn" class="tool-btn" type="button" aria-label="Erase selected cell">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m20 20-9-9 6-6a2.5 2.5 0 0 1 3.5 3.5L15 13"/><path d="M4 20h9"/><path d="m9 11-5 5 4 4"/></svg>
        <span>Erase</span>
      </button>
      <button id="notesBtn" class="tool-btn" type="button" aria-label="Toggle notes mode" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        <span>Notes</span>
      </button>
      <button id="hintBtn" class="tool-btn" type="button" aria-label="Get a hint">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.2 1 2.05V17h6v-.25c0-.85.4-1.55 1-2.05A7 7 0 0 0 12 2Z"/></svg>
        <span id="hintLabel">Hint</span>
      </button>
    </div>

    <div class="numpad" role="group" aria-label="Number pad">
      <button class="num-btn" type="button" data-num="1">1</button>
      <button class="num-btn" type="button" data-num="2">2</button>
      <button class="num-btn" type="button" data-num="3">3</button>
      <button class="num-btn" type="button" data-num="4">4</button>
      <button class="num-btn" type="button" data-num="5">5</button>
      <button class="num-btn" type="button" data-num="6">6</button>
      <button class="num-btn" type="button" data-num="7">7</button>
      <button class="num-btn" type="button" data-num="8">8</button>
      <button class="num-btn" type="button" data-num="9">9</button>
    </div>
  </main>

  <!-- Menu / New game / settings panel -->
  <div id="menuScrim" class="scrim hidden"></div>
  <aside id="menuPanel" class="menu-panel hidden" role="dialog" aria-modal="true" aria-label="Menu">
    <div class="menu-header">
      <h2>Menu</h2>
      <button id="closeMenuBtn" class="icon-btn" type="button" aria-label="Close menu">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
      </button>
    </div>

    <section class="menu-section">
      <h3>New game</h3>
      <div class="difficulty-grid">
        <button class="difficulty-btn" type="button" data-difficulty="easy">Easy</button>
        <button class="difficulty-btn" type="button" data-difficulty="medium">Medium</button>
        <button class="difficulty-btn" type="button" data-difficulty="hard">Hard</button>
        <button class="difficulty-btn" type="button" data-difficulty="expert">Expert</button>
      </div>
    </section>

    <section class="menu-section">
      <h3>Settings</h3>
      <label class="toggle-row">
        <span>High-contrast mode</span>
        <input type="checkbox" id="contrastToggle">
      </label>
      <label class="toggle-row">
        <span>Highlight same numbers</span>
        <input type="checkbox" id="highlightSameToggle" checked>
      </label>
      <label class="toggle-row">
        <span>Auto-clear notes on placement</span>
        <input type="checkbox" id="autoClearNotesToggle" checked>
      </label>
      <label class="toggle-row">
        <span>Show timer</span>
        <input type="checkbox" id="showTimerToggle" checked>
      </label>
    </section>

    <section class="menu-section">
      <h3>Stats</h3>
      <ul id="statsList" class="stats-list"></ul>
    </section>
  </aside>

  <!-- Win dialog -->
  <div id="winScrim" class="scrim hidden"></div>
  <div id="winDialog" class="win-dialog hidden" role="dialog" aria-modal="true" aria-labelledby="winTitle">
    <h2 id="winTitle">Puzzle solved!</h2>
    <p id="winSummary"></p>
    <button id="winNewGameBtn" class="primary-btn" type="button">New game</button>
  </div>

  <div id="ariaAnnouncer" class="sr-only" aria-live="polite"></div>
</div>

<script src="engine.js"></script>
<script src="game.js"></script>
</body>
</html>
