<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Little Farm School</title>
<meta name="description" content="A kid-friendly farming education game — plant, care for animals, and turn your harvest into real food.">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header id="hud-top">
    <div class="hud-chip" id="hud-coins">🪙 <span id="coins-val">0</span></div>
    <button class="hud-icon-btn" id="btn-market"><span class="hud-icon">🛒</span><span class="hud-label"></span></button>
    <button class="hud-icon-btn" id="btn-save"><span class="hud-icon">💾</span><span class="hud-label"></span></button>
    <button class="hud-icon-btn" id="btn-fullscreen"><span class="hud-icon">⛶</span><span class="hud-label"></span></button>
    <button class="hud-icon-btn" id="btn-settings"><span class="hud-icon">⚙️</span><span class="hud-label"></span></button>
  </header>

  <div id="top-info">
    <div id="day-bar">
      <span id="coins-val-top">🪙 <span id="coins-val-top-num">0</span></span>
      <span id="day-val"></span>
      <span id="season-val"></span>
      <span id="weather-val"></span>
    </div>
    <div id="mission-chip" class="hidden"></div>
  </div>

  <main id="stage">
    <canvas id="farm-canvas"></canvas>
  </main>

  <footer id="tool-belt"></footer>

  <div id="tooltip" class="hidden"></div>
  <div id="modal-root" class="hidden"></div>
  <div id="toast-root"></div>

  <div id="rotate-overlay" class="hidden">
    <div>
      <div class="rotate-icon">📱</div>
      <h1 id="rotate-title">Rotate your device</h1>
      <p id="rotate-body">Little Farm School plays in landscape mode.<br>Turn your phone sideways to continue.</p>
    </div>
  </div>
</div>

<script src="js/version.js"></script>
<script src="js/config.js"></script>
<script src="js/data-crops.js"></script>
<script src="js/data-animals.js"></script>
<script src="js/data-recipes.js"></script>
<script src="js/data-quarry.js"></script>
<script src="js/data-seasons.js"></script>
<script src="js/data-missions.js"></script>
<script src="js/events.js"></script>
<script src="js/audio.js"></script>
<script src="js/farm-rules.js"></script>
<script src="js/locale-en.js"></script>
<script src="js/locale-pt.js"></script>
<script src="js/i18n.js"></script>
<script src="js/state.js"></script>
<script src="js/persistence.js"></script>
<script src="js/economy.js"></script>
<script src="js/simulation.js"></script>
<script src="js/missions.js"></script>
<script src="js/tutorial.js"></script>
<script src="js/render.js"></script>
<script src="js/input.js"></script>
<script src="js/hud.js"></script>
<script src="js/modals.js"></script>
<script src="js/game.js"></script>
</body>
</html>
